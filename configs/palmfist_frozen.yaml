# Binary click classifier (AD-18, cursor-control pivot): palm = no click,
# fist = click. SAME recipe as configs/bbox_frozen.yaml -- backbone, seed,
# epochs, freeze policy, crop_mode: bbox -- only the class list (data.yaml)
# and num_classes change, so the result is comparable to the 8-class run.
#
# Stage A (AD-08): backbone FROZEN, head-only. Frozen + no-aug => the linear-
# probe fast path. Stage B (unfreeze_blocks > 0) and the 2.1 aug knobs stay
# OFF here -- whether/when to reach for them is Ted's call after these numbers.

data_config: configs/data.yaml   # classes: [palm, fist] lives here

model:
  backbone: mobilenetv3_large_100   # same backbone (AD-07)
  num_classes: 2
  freeze_backbone: true             # Stage A: head-only
  pretrained: true

train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  batch_size: 64
  num_workers: 0   # CPU box: in-process decode beats multiproc IPC here
  seed: 42
  augment_train: false
  precompute_features: true         # frozen + no aug => cache features, linear-probe

out_dir: models/palmfist_frozen_mnv3_large
